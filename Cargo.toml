[workspace]
members = ["crates/*"]
resolver = "3"

# Identity of the Cargo workspace in Turborepo's package graph.
[workspace.metadata]
name = "cargo-workspace"

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/denkwerk/favicon-generator"

[profile.release]
codegen-units = 1
lto = true
strip = true
