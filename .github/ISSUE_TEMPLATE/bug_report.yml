name: Bug report
description: Something is generated wrong, a command fails, or the docs don't match what happens
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - '@denkwerk/favicon-generator (CLI or Node.js API)'
        - '@denkwerk/nuxt-favicon-generator'
        - '@denkwerk/unplugin-favicon-generator'
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.2.2
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and CPU, Node.js version, and the bundler or Nuxt version if relevant
      placeholder: macOS arm64, Node.js 24.15, Vite 8.3
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config
      description: Your `favicon.config.*`, CLI flags or plugin/module options. Leave out Figma tokens.
      render: ts
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: Include the full error output. If you can, attach the input image or a minimal reproduction.
    validations:
      required: true
