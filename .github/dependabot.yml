# Tool versions: new Rust releases (rust-toolchain.toml) and GitHub Actions.
# Dependabot does not read mise.toml; see "Tool versions" in CONTRIBUTING.md.
version: 2
updates:
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
