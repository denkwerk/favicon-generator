name: CI

# Pushes to main run CI through the release workflow, which calls this one.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The mise release that installs the tools; also in release.yml.
  MISE_VERSION: 2026.9.11
  FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}

jobs:
  check:
    name: Build, lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Normally ~5 minutes; a process that never exits would otherwise block
    # the release for GitHub's default of 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: node
      # The toolchain and components from rust-toolchain.toml, with the
      # runner's rustup: mise's cache would only restore a link to it.
      - run: rustup toolchain install
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      # Before everything that runs the binary: `cargo test` builds the crate
      # with its dev-dependencies, which changes the features of shared
      # dependencies, so it relinks target/debug/favicon-generator. On Windows
      # that fails while another task is running the executable.
      - name: Lint and test the crate
        run: pnpm turbo run lint test --filter=favicon-generator

      # Builds the crate, the npm packages and the examples (the Nuxt and Vite
      # ones run the module and the plugin), type-checks them, checks their
      # output and runs the CLI and TypeScript examples. The crate's own lint
      # and tests ran above. example-cli-figma needs a Figma token; it runs in
      # its own step below.
      - run: pnpm turbo run build lint test typecheck generate --filter='!example-cli-figma' --filter='!favicon-generator'
      - run: pnpm turbo run typecheck --filter=example-cli-figma

      - name: Figma example
        if: env.FIGMA_TOKEN != ''
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          pnpm turbo run generate --filter=example-cli-figma
          test -s examples/cli-figma/public/favicons/favicon.ico

      - name: Verify generated files
        shell: bash
        run: |
          for file in favicon.ico favicon.svg favicon-96x96.png favicon-512x512.png apple-touch-icon.png manifest.json favicon.html; do
            test -s "examples/cli/public/favicons/$file" || { echo "missing $file"; exit 1; }
          done
          test -s examples/typescript/public/favicons/favicon.html
