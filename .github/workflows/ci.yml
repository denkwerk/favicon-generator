name: CI

# Pushes to main run CI through the release workflow, which calls this one.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}

jobs:
  check:
    name: Build, lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Normally ~5 minutes; a process that never exits would otherwise block
    # the release for GitHub's default of 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      # Builds the crate, the npm packages and the Nuxt examples (which run the
      # module), lints and tests the Cargo workspace, type-checks the examples,
      # checks the Nuxt output and runs the CLI and TypeScript examples.
      # example-cli-figma needs a Figma token; it runs in its own step below.
      - run: pnpm turbo run build lint test typecheck generate --filter='!example-cli-figma'
      - run: pnpm turbo run typecheck --filter=example-cli-figma

      - name: Figma example
        if: env.FIGMA_TOKEN != ''
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          pnpm turbo run generate --filter=example-cli-figma
          test -s examples/cli-figma/public/favicons/favicon.ico

      - name: Verify generated files
        shell: bash
        run: |
          for file in favicon.ico favicon.svg favicon-96x96.png favicon-512x512.png apple-touch-icon.png manifest.json favicon.html; do
            test -s "examples/cli/public/favicons/$file" || { echo "missing $file"; exit 1; }
          done
          test -s examples/typescript/public/favicons/favicon.html
