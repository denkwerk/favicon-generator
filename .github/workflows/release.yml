name: Release

# Every push to main is a release candidate. semantic-release reads the
# Conventional Commits since the last tag; if they call for a release, the
# binaries are built, the npm packages published with trusted publishing
# (OIDC, no token), and the version bump and CHANGELOG.md committed back,
# together with a tag and a GitHub release.
#
# Run manually for a dry run (builds and packs everything, publishes nothing),
# or with a tag to publish an existing release to npm again.
on:
  push:
    branches: [main, next]
  workflow_dispatch:
    inputs:
      tag:
        description: Publish this existing tag (e.g. v0.2.0) again. Leave empty for a dry run.
        required: false
        default: ''

# One release at a time, never cancelled half-way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  version:
    name: Resolve version
    runs-on: ubuntu-latest
    permissions:
      contents: write # semantic-release checks that it may push, even in a dry run
    outputs:
      version: ${{ steps.version.outputs.version }}
      # release: publish a new version; recover: publish an existing tag again;
      # dry-run: build and pack only; none: nothing to release.
      mode: ${{ steps.version.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NEXT_VERSION_FILE: ${{ runner.temp }}/next-version
        run: |
          if [[ -n "$TAG" ]]; then
            version="${TAG#v}"
            node scripts/set-version.ts --check "$version"
            mode=recover
          else
            pnpm exec semantic-release --dry-run
            if [[ -s "$NEXT_VERSION_FILE" ]]; then
              version="$(cat "$NEXT_VERSION_FILE")"
              if [[ "$GITHUB_EVENT_NAME" == push ]]; then mode=release; else mode=dry-run; fi
            else
              version="$(node -p "require('./packages/favicon-generator/package.json').version")"
              if [[ "$GITHUB_EVENT_NAME" == push ]]; then mode=none; else mode=dry-run; fi
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "::notice::version $version, mode $mode"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.mode != 'none'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zigbuild: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            zigbuild: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Bakes the release version into `favicon-generator --version`.
      - run: node scripts/set-version.ts "$VERSION"
        shell: bash

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Static musl binaries, cross-compiled with zig as the linker.
      - if: matrix.zigbuild
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - if: matrix.zigbuild
        run: pipx install cargo-zigbuild

      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.zigbuild }}" == true ]]; then
            cargo zigbuild --locked --release --target ${{ matrix.target }}
          else
            cargo build --locked --release --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          exe=favicon-generator
          [[ "${{ matrix.target }}" == *windows* ]] && exe=favicon-generator.exe
          mkdir -p "dist/${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/$exe" "dist/${{ matrix.target }}/"
          archive="favicon-generator-v$VERSION-${{ matrix.target }}"
          if [[ "$exe" == *.exe ]]; then
            (cd "dist/${{ matrix.target }}" && 7z a "../../$archive.zip" "$exe")
          else
            tar -czf "$archive.tar.gz" -C "dist/${{ matrix.target }}" "$exe"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: dist/${{ matrix.target }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.target }}
          path: favicon-generator-v*
          if-no-files-found: error

  package:
    name: Pack npm packages
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: artifacts
      - run: for dir in artifacts/binary-*; do mv "$dir" "artifacts/${dir#artifacts/binary-}"; done

      - run: pnpm install --frozen-lockfile
      - run: node scripts/set-version.ts "$VERSION"
      # Only the TypeScript builds: the binaries come from the build job.
      - run: pnpm --filter @denkwerk/favicon-generator --filter @denkwerk/nuxt-favicon-generator run build
      - run: node scripts/prepare-npm.ts artifacts

      - name: Smoke test the linux-x64 binary through the package
        run: |
          test "$(node packages/favicon-generator/bin/favicon-generator.js --version)" = "favicon-generator $VERSION"
          node packages/favicon-generator/bin/favicon-generator.js examples/typescript/assets/favicon.svg "$RUNNER_TEMP/smoke" --no-config
          test -s "$RUNNER_TEMP/smoke/favicon.ico"

      # Checks that the core package ships all binaries (executable, below
      # 20 MB) and that no `workspace:` range is left.
      - run: node scripts/pack-npm.ts dist-npm "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: dist-npm
          if-no-files-found: error

  publish:
    name: Publish
    needs: [ci, version, package]
    if: needs.version.outputs.mode == 'release' || needs.version.outputs.mode == 'recover'
    runs-on: ubuntu-latest
    # npm trusted publishing only accepts this workflow in this environment.
    environment: npm
    permissions:
      contents: write # release commit, tag and GitHub release
      id-token: write # npm trusted publishing and provenance
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@v6
      # Node.js 24 ships npm 11, which supports trusted publishing (>= 11.5.1).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: dist-npm
      - uses: actions/download-artifact@v8
        with:
          pattern: archive-*
          path: archives
          merge-multiple: true

      # Provenance statements are only supported for public repositories.
      - name: Release
        if: needs.version.outputs.mode == 'release'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ needs.version.outputs.version }}
          NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}
        run: pnpm exec semantic-release

      - name: Publish the existing tag again
        if: needs.version.outputs.mode == 'recover'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}
        run: |
          if [[ "$VERSION" == *-* ]]; then npm_tag=next; else npm_tag=latest; fi
          node scripts/publish-npm.ts dist-npm "$VERSION" "$npm_tag"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" archives/* --clobber
          else
            prerelease=()
            [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
            gh release create "$TAG" archives/* --title "v$VERSION" --notes-from-tag --verify-tag "${prerelease[@]}"
          fi
