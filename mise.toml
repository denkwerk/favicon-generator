# Development tools, for `mise install` (https://mise.jdx.dev) and CI.
# Rust comes from rust-toolchain.toml and pnpm from `packageManager` in
# package.json; this file pins everything else.
[settings]
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true

[tools]
node = "24.21.0"
# Static musl release binaries, cross-compiled with zig as the linker.
zig = "0.14.1"
"aqua:rust-cross/cargo-zigbuild" = "0.23.4"
